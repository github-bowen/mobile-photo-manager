<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="iPhone Photo Manager — Browse and search your photo library by time and location">
  <title data-i18n="app_title">iPhone 照片管理</title>
  <!-- Render-blocking theme boot: must load before the stylesheet applies
       so the first paint already has the right palette. -->
  <script src="/js/boot.js"></script>
  <!-- ?v=17 is a placeholder: at startup the server replaces every local
       asset's ?v=N with a sha1 content hash, so no manual bumping is needed. -->
  <link rel="stylesheet" href="/index.css?v=17">
</head>
<body>
  <div class="app" id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="sidebar-logo-icon">📸</div>
          <span class="sidebar-logo-text" data-i18n="app_title"></span>
        </div>
      </div>

      <!-- Timeline Section -->
      <div class="sidebar-section" id="sidebar-timeline-section">
        <div class="sidebar-section-title">📅 <span data-i18n="timeline"></span></div>
        <div id="sidebar-timeline"></div>
      </div>

      <!-- Locations Section -->
      <div class="sidebar-section" id="sidebar-locations-section">
        <div class="sidebar-section-title">📍 <span data-i18n="locations"></span></div>
        <div id="sidebar-locations"></div>
      </div>

      <!-- Stats -->
      <div class="sidebar-stats" id="sidebar-stats">
        <span data-i18n="loading"></span>
      </div>
      <!-- Mobile Sidebar Overlay -->
      <div class="sidebar-overlay" id="sidebar-overlay"></div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <!-- Scan Banner -->
      <div class="scan-banner hidden" id="scan-banner">
        <div class="scan-banner-spinner"></div>
        <span id="scan-banner-text" data-i18n="scanning"></span>
        <div class="scan-banner-progress">
          <div class="scan-banner-progress-bar" id="scan-banner-progress"></div>
        </div>
      </div>

      <!-- Header / Toolbar -->
      <header class="header" id="header">
        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu">☰</button>
        <div class="search-container">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="search-input"
                 data-i18n-placeholder="search_placeholder" autocomplete="off">
        </div>
        <div class="filter-group" id="filter-group">
          <button class="filter-btn active" data-filter="all" id="filter-all" data-i18n="filter_all"></button>
          <button class="filter-btn" data-filter="photos" id="filter-photos" data-i18n="filter_photos"></button>
          <button class="filter-btn" data-filter="videos" id="filter-videos" data-i18n="filter_videos"></button>
          <button class="filter-btn" data-filter="screenshots" id="filter-screenshots" data-i18n="filter_screenshots"></button>
          <button class="filter-btn" data-filter="favorites" id="filter-favorites" data-i18n="filter_favorites"></button>
          <input type="date" class="date-input" id="date-from" data-i18n-title="date_from">
          <input type="date" class="date-input" id="date-to" data-i18n-title="date_to">
        </div>

        <div class="header-actions">
          <button class="header-action-btn" id="autoplay-btn" title="Slideshow / 幻灯片">
            ▶️ <span data-i18n="slideshow" style="font-size: 13px;">幻灯片</span>
          </button>
          <div class="toggle-pill active" id="sort-toggle" title="Sort Order / 排序" role="switch" tabindex="0" aria-checked="true">
            <div class="toggle-pill-bg"></div>
            <div class="toggle-pill-option left">🔽</div>
            <div class="toggle-pill-option right">🔼</div>
          </div>
          <div class="toggle-pill" id="theme-toggle" title="Theme / 主题" role="switch" tabindex="0" aria-checked="false">
            <div class="toggle-pill-bg"></div>
            <div class="toggle-pill-option left"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></div>
            <div class="toggle-pill-option right"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></div>
          </div>
          <div class="toggle-pill" id="load-original-toggle" title="Image Quality" role="switch" tabindex="0" aria-checked="false">
            <div class="toggle-pill-bg"></div>
            <div class="toggle-pill-option left">⚡️</div>
            <div class="toggle-pill-option right">4K</div>
          </div>
          <div class="toggle-pill" id="lang-toggle" title="Language / 语言" role="switch" tabindex="0" aria-checked="false">
            <div class="toggle-pill-bg"></div>
            <div class="toggle-pill-option left">中</div>
            <div class="toggle-pill-option right">EN</div>
          </div>
        </div>
      </header>

      <!-- Photo Gallery -->
      <div class="gallery-container" id="gallery-container">
        <div id="gallery"></div>
        <div class="load-more-container" id="load-more-container" style="display:none;">
          <button class="load-more-btn" id="load-more-btn" data-i18n="load_more"></button>
        </div>
      </div>
    </main>
  </div>

  <!-- Photo Detail Modal -->
  <div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true" aria-label="Photo viewer" data-i18n-aria="photo_dialog">
    <div id="modal-autoplay-toolbar" class="modal-autoplay-toolbar">
      <div class="mat-header">
        <span class="mat-title" data-i18n="autoplay_title">▶ 自动播放 / Slideshow</span>
        <button id="modal-autoplay-toggle" class="mat-play-btn" title="Toggle Slideshow">▶</button>
      </div>
      <div class="mat-controls">
        <div class="mat-duration">
          <label data-i18n="autoplay_duration_lbl">停留时长:</label>
          <input type="range" id="modal-autoplay-duration" value="3" min="1" max="10" step="1">
          <span id="modal-autoplay-dur-val">3s</span>
        </div>
        <label class="mat-wait-label">
          <input type="checkbox" id="modal-autoplay-wait-video" checked>
          <span data-i18n="autoplay_wait_video">播完视频再切换</span>
        </label>
        
        <div class="mat-duration">
          <label data-i18n="autoplay_direction">方向:</label>
          <select id="modal-autoplay-direction" class="mat-select">
            <option value="forward" data-i18n="autoplay_dir_forward">向后播放 (→)</option>
            <option value="backward" data-i18n="autoplay_dir_backward">向前播放 (←)</option>
          </select>
        </div>
      </div>
    </div>

    <button class="modal-close" id="modal-close" data-i18n-title="close_btn">✕</button>
    <div class="modal-content">
      <div class="modal-image-container" id="modal-image-container">
        
        <button class="modal-nav prev" id="modal-prev" data-i18n-title="prev_btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <!-- Image or video will be inserted here dynamically -->
        <button class="modal-nav next" id="modal-next" data-i18n-title="next_btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
      <div class="modal-info" id="modal-info">
        <!-- Photo details will be inserted here dynamically -->
      </div>
    </div>
  </div>

  <!-- Autoplay Config Modal -->
  <div id="autoplay-config-modal" class="autoplay-modal-overlay" role="dialog" aria-modal="true" data-i18n-aria="slideshow_config">
    <div class="autoplay-modal-content">
      <h3 class="autoplay-modal-title">▶️ <span data-i18n="slideshow_config">幻灯片播放设置</span></h3>

      <div class="autoplay-modal-section">
        <label class="autoplay-modal-label" data-i18n="autoplay_date_range">📅 日期范围</label>
        <div class="autoplay-modal-row">
          <input type="date" id="autoplay-date-from" class="date-input" style="flex: 1;">
          <input type="date" id="autoplay-date-to" class="date-input" style="flex: 1;">
        </div>
      </div>

      <div class="autoplay-modal-section">
        <label class="autoplay-modal-label" data-i18n="autoplay_location">📍 地点范围 (国家)</label>
        <div id="autoplay-location-container" class="autoplay-checkbox-group">
          <!-- Checkboxes injected by JS -->
        </div>
      </div>

      <div class="autoplay-modal-section">
        <label class="autoplay-modal-label" data-i18n="autoplay_media_type">🖼️ 媒体类型</label>
        <div class="autoplay-checkbox-group">
          <label class="autoplay-checkbox-label"><input type="checkbox" id="autoplay-type-photo" checked> <span data-i18n="autoplay_photo">照片</span></label>
          <label class="autoplay-checkbox-label"><input type="checkbox" id="autoplay-type-video" checked> <span data-i18n="autoplay_video">视频</span></label>
          <label class="autoplay-checkbox-label"><input type="checkbox" id="autoplay-type-screenshot"> <span data-i18n="autoplay_screenshot">截图</span></label>
        </div>
      </div>

      <div class="autoplay-modal-section">
        <label class="autoplay-modal-label" data-i18n="autoplay_duration_title">⏱️ 每张停留时长</label>
        <div class="autoplay-range-row">
          <input type="range" id="autoplay-duration" value="3" min="1" max="10" step="1" style="flex: 1; accent-color: var(--accent-purple);">
          <span id="autoplay-duration-display" style="min-width: 32px; text-align: center; color: var(--text-primary); font-weight: bold; font-size: 14px;">3s</span>
        </div>
      </div>

      <div class="autoplay-modal-section">
        <label class="autoplay-modal-label" data-i18n="autoplay_sort_order">🔄 播放顺序</label>
        <div class="autoplay-radio-group">
          <label class="autoplay-radio-btn">
            <input type="radio" name="autoplay-sort" id="autoplay-sort-desc" value="desc" checked>
            <span data-i18n="autoplay_sort_desc">从晚到早 (最新)</span>
          </label>
          <label class="autoplay-radio-btn">
            <input type="radio" name="autoplay-sort" id="autoplay-sort-asc" value="asc">
            <span data-i18n="autoplay_sort_asc">从早到晚 (最旧)</span>
          </label>
        </div>
      </div>

      <div class="autoplay-modal-section">
        <label class="autoplay-wait-video-label">
          <input type="checkbox" id="autoplay-wait-video" checked>
          <span data-i18n="autoplay_wait_video_long">播放完整视频 / Live 图后再切换</span>
        </label>
      </div>

      <div class="autoplay-actions">
        <button id="autoplay-cancel-btn" class="autoplay-btn-cancel" data-i18n="autoplay_cancel">取消</button>
        <button id="autoplay-start-btn" class="autoplay-btn-start" data-i18n="autoplay_start">▶ 开始播放</button>
      </div>
    </div>
  </div>

  <!-- Loading Overlay (initial scan) -->
  <div class="loading-overlay hidden" id="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loading-text" data-i18n="initializing"></div>
    <div class="loading-progress">
      <div class="loading-progress-bar" id="loading-progress-bar"></div>
    </div>
  </div>

  <script type="module" src="/js/main.js?v=17"></script>
</body>
</html>
